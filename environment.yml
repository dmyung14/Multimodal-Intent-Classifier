# Conda environment for the Multimodal Intent Inference project.
# Create it with:   conda env create -f environment.yml
# Activate it with: conda activate mmi
name: mmi
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- Milestone 0 needs only these (lightweight, CPU, instant) ---
  - pandas
  - numpy
  - scikit-learn
  - matplotlib
  - jupyter
  # ffmpeg is for pulling audio out of video clips later (Milestone 2)
  - ffmpeg
  - pip
  # --- Milestone 1+ (heavier, a few hundred MB of downloads) ---
  #     The uncommented ones are REQUIRED by Milestone 2's real-data
  #     pipeline (src/generate_mintrec_multimodal.py and
  #     src/extract_mintrec_embeddings.py import them directly).
  - pip:
    - torch
    - torchvision
    - transformers
    - huggingface_hub
    - pillow
    # Only needed for Milestone 1's OPTIONAL distilbert fine-tuning path
    # (src/train_mintrec.py --finetune). Uncomment if you run that.
    # - datasets
    # - accelerate
